      - name: Locate kernel build script
        shell: bash
        run: |
          set -e

          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Top-level files:"
          ls -la

          echo "Searching for build scripts..."
          find . -maxdepth 5 -type f \
            \( -name "build.sh" -o -name "Makefile" \) \
            -print | head -100

          echo "Checking build configurations..."
          find . -maxdepth 4 -type f \
            -name "build.config.gki.aarch64" \
            -print

          if [ ! -f build/build.sh ]; then
            echo "::error::build/build.sh is missing."
            echo "Use the repository's actual build entry point."
            exit 1
          fi
