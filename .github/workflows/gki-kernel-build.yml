name: Build GKI Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KSU_NEXT_REF: v3.4.2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 10G
  ARCH: arm64
  # A stable timestamp improves ccache reuse between runs.
  KBUILD_BUILD_TIMESTAMP: ''

jobs:
  build:
    name: Build ARM64 GKI Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: '8192'
          temp-reserve-mb: '2048'
          swap-size-mb: '4096'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: aetherium
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      - name: Configure ccache
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo '===== ccache configuration ====='
          ccache --show-config

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: gki-ccache-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'arch/arm64/configs/gki_defconfig', 'build.config.gki.aarch64', 'build.config.common') }}
          restore-keys: |
            gki-ccache-v4-${{ runner.os }}-${{ runner.arch }}-
            gki-ccache-v4-${{ runner.os }}-

      - name: Show initial ccache statistics
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== Initial ccache statistics ====='
          ccache --show-stats

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== Build environment ====='
          echo 'Kernel commit:'
          git rev-parse HEAD
          echo 'Kernel branch:'
          git branch --show-current || true
          echo 'Kernel version:'
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 kernelversion
          echo 'Architecture:' "$ARCH"
          echo 'Clang:'
          clang --version
          echo 'ccache:'
          ccache --version
          echo 'CPU cores:' "$(nproc)"
          echo 'Memory and swap:'
          free -h
          echo 'Disk space:'
          df -h "$GITHUB_WORKSPACE"

      - name: Verify GKI defconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          CONFIG='arch/arm64/configs/gki_defconfig'
          echo '===== Checking GKI defconfig ====='
          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::$CONFIG was not found."
            exit 1
          fi
          ls -lh "$CONFIG"
          echo '===== Relevant configuration options ====='
          grep -E '^(CONFIG_ARCH_QCOM|CONFIG_KPROBES|CONFIG_MODULES|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_FULL|CONFIG_CFI_CLANG|CONFIG_KASAN)=' "$CONFIG" || true

      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "===== Installing KernelSU-Next $KSU_NEXT_REF ====="
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_REF}/kernel/setup.sh" | bash -s "$KSU_NEXT_REF"
          if [[ ! -d KernelSU-Next ]]; then
            echo '::error::KernelSU-Next directory was not created.'
            exit 1
          fi
          echo 'KernelSU-Next commit:'
          git -C KernelSU-Next rev-parse HEAD
          echo 'KernelSU-Next description:'
          git -C KernelSU-Next describe --tags --always || true

      - name: Configure kernel and KernelSU-Next
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== Generating kernel configuration ====='
          rm -rf out
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig

          if [[ -x scripts/config ]]; then
            CONFIG_TOOL=scripts/config
          elif [[ -f scripts/config ]]; then
            chmod +x scripts/config
            CONFIG_TOOL=scripts/config
          else
            echo '::error::scripts/config was not found.'
            exit 1
          fi

          "$CONFIG_TOOL" --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_KPROBE_HOOKS

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo '===== KernelSU configuration ====='
          grep -E '^CONFIG_(KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBE_HOOKS)=' out/.config || true
          echo '===== LTO configuration ====='
          grep -E '^CONFIG_LTO_CLANG(_FULL|_THIN)?=' out/.config || true

      - name: Build kernel with resource monitoring
        shell: bash
        env:
          CC: ccache clang
          HOSTCC: ccache clang
          HOSTCXX: ccache clang++
        run: |
          set -Eeuo pipefail
          echo '===== Starting GKI kernel build ====='
          echo "CPU cores available: $(nproc)"
          echo '===== ccache before build ====='
          ccache --show-stats
          ccache --zero-stats

          monitor_resources() {
            while sleep 30; do
              echo
              echo '========== RESOURCE MONITOR =========='
              date -Is
              free -h
              echo '--- /proc/meminfo ---'
              grep -E '^(MemAvailable|MemTotal|SwapTotal|SwapFree):' /proc/meminfo || true
              echo '--- Top processes by RSS ---'
              ps -eo pid,comm,%cpu,%mem,rss --sort=-rss | sed -n '1,10p'
              echo '--- Disk space ---'
              df -h "$GITHUB_WORKSPACE"
              echo '======================================='
            done
          }

          monitor_resources &
          MONITOR_PID=$!

          stop_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap stop_monitor EXIT

          echo 'Building with -j2 to reduce concurrent memory demand.'
          if make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CC='ccache clang' \
            HOSTCC='ccache clang' \
            HOSTCXX='ccache clang++' \
            -j2; then
            BUILD_STATUS=0
            echo 'Kernel build command completed successfully.'
          else
            BUILD_STATUS=$?
            echo "::error::Kernel build failed with exit code $BUILD_STATUS."
          fi

          stop_monitor
          trap - EXIT

          echo '===== Final resource snapshot ====='
          free -h
          df -h "$GITHUB_WORKSPACE"
          echo '===== Final ccache statistics ====='
          ccache --show-stats
          exit "$BUILD_STATUS"

      - name: Show ccache results
        if: always()
        shell: bash
        run: |
          echo '===== Final ccache statistics ====='
          ccache --show-stats || true
          echo '===== ccache configuration ====='
          ccache --show-config || true

      - name: Locate kernel artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== Searching for kernel artifacts ====='
          mkdir -p artifacts

          IMAGE="$(find out -type f -name Image -print -quit || true)"
          if [[ -z "$IMAGE" ]]; then
            echo '::error::No kernel Image was produced.'
            exit 1
          fi
          echo "Found Image: $IMAGE"
          cp "$IMAGE" artifacts/Image

          IMAGE_LZ4="$(find out -type f -name Image.lz4 -print -quit || true)"
          if [[ -n "$IMAGE_LZ4" ]]; then
            cp "$IMAGE_LZ4" artifacts/Image.lz4
          fi

          VMLINUX="$(find out -type f -name vmlinux -print -quit || true)"
          if [[ -n "$VMLINUX" ]]; then
            cp "$VMLINUX" artifacts/vmlinux
          fi

          SYSTEM_MAP="$(find out -type f -name System.map -print -quit || true)"
          if [[ -n "$SYSTEM_MAP" ]]; then
            cp "$SYSTEM_MAP" artifacts/System.map
          fi

          MODULE_SYMVERS="$(find out -type f -name Module.symvers -print -quit || true)"
          if [[ -n "$MODULE_SYMVERS" ]]; then
            cp "$MODULE_SYMVERS" artifacts/Module.symvers
          fi

          if [[ -f out/.config ]]; then
            cp out/.config artifacts/kernel.config
          fi

          find out -type f -name '*.ko' -exec cp -n '{}' artifacts/ \; || true
          echo '===== Artifact files ====='
          ls -lah artifacts

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSU-Next-v3.4.2-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
