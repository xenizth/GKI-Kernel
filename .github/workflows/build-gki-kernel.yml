name: Build GKI Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # KernelSU-Next release to integrate
  KSU_NEXT_REF: v3.4.2

  # Persistent ccache directory
  CCACHE_DIR: ${{ github.workspace }}/.ccache

  # Maximum ccache size
  CCACHE_MAXSIZE: 10G

  # Android GKI build settings
  ARCH: arm64
  LTO: thin

jobs:
  build:
    name: Android 12 - 5.10 GKI
    runs-on: ubuntu-22.04

    steps:
      # ---------------------------------------------------------
      # Free as much disk space as possible
      # ---------------------------------------------------------
      - name: Maximize disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # ---------------------------------------------------------
      # Checkout kernel
      # ---------------------------------------------------------
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: aetherium
          fetch-depth: 1
          submodules: recursive

      # ---------------------------------------------------------
      # Install build dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            liblz4-tool \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      # ---------------------------------------------------------
      # Configure ccache
      # ---------------------------------------------------------
      - name: Configure ccache
        shell: bash
        run: |
          set -e

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"

          # Compression saves GitHub Actions cache space
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          # Check compiler contents instead of only compiler timestamp
          ccache --set-config=compiler_check=content

          # Keep ccache from following huge build directories
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ccache configuration"
          echo "========================================"

          ccache --show-config
          ccache --max-size="$CCACHE_MAXSIZE"

      # ---------------------------------------------------------
      # Restore persistent ccache
      # ---------------------------------------------------------
      #
      # The cache survives between GitHub Actions runs.
      #
      # Exact key:
      #   Same OS + build configuration + compiler environment
      #
      # Restore key:
      #   Allows an older compatible cache to be reused.
      #
      # ---------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            kernel-ccache-v2-${{ runner.os }}-
            ${{ hashFiles(
              'build.config.gki.aarch64',
              'build.config.common',
              'build.config.aarch64',
              'build.config.gki'
            ) }}-
            ${{ env.LTO }}
          restore-keys: |
            kernel-ccache-v2-${{ runner.os }}-

      # ---------------------------------------------------------
      # Display cache status
      # ---------------------------------------------------------
      - name: Show ccache statistics
        run: |
          echo "========================================"
          echo "Initial ccache statistics"
          echo "========================================"

          ccache --show-stats

      # ---------------------------------------------------------
      # Show build environment
      # ---------------------------------------------------------
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Build environment"
          echo "========================================"

          echo "Kernel branch:"
          git branch --show-current

          echo
          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "KernelSU-Next:"
          echo "$KSU_NEXT_REF"

          echo
          echo "Architecture:"
          echo "$ARCH"

          echo
          echo "LTO:"
          echo "$LTO"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "ccache:"
          ccache --version

      # ---------------------------------------------------------
      # Install KernelSU-Next v3.4.2
      # ---------------------------------------------------------
      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Installing KernelSU-Next $KSU_NEXT_REF"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_REF}/kernel/setup.sh" \
            | bash -s "$KSU_NEXT_REF"

          echo
          echo "KernelSU-Next installation complete."

          if [ ! -d "KernelSU-Next" ]; then
            echo "::error::KernelSU-Next directory was not created."
            exit 1
          fi

          echo
          echo "KernelSU-Next commit:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "KernelSU-Next tag:"
          git -C KernelSU-Next describe --tags --always || true

      # ---------------------------------------------------------
      # Enable KernelSU
      # ---------------------------------------------------------
      - name: Enable KernelSU
        shell: bash
        run: |
          set -e

          CONFIG="arch/arm64/configs/gki_defconfig"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG was not found."
            exit 1
          fi

          echo "========================================"
          echo "Enabling KernelSU"
          echo "========================================"

          if grep -q '^CONFIG_KSU=' "$CONFIG"; then
            sed -i 's/^CONFIG_KSU=.*/CONFIG_KSU=y/' "$CONFIG"
          else
            echo 'CONFIG_KSU=y' >> "$CONFIG"
          fi

          echo
          echo "KernelSU configuration:"
          grep '^CONFIG_KSU=' "$CONFIG"

      # ---------------------------------------------------------
      # Build kernel
      # ---------------------------------------------------------
      - name: Build kernel
        shell: bash
        env:
          CCACHE: ccache
        run: |
          set -e

          echo "========================================"
          echo "Starting GKI kernel build"
          echo "========================================"

          echo
          echo "CPU cores:"
          nproc

          echo
          echo "ccache before build:"
          ccache --show-stats

          # Clear only the statistics counters.
          # This does NOT delete cached compiler objects.
          ccache --zero-stats

          echo
          echo "Building..."

          BUILD_CONFIG="${GITHUB_WORKSPACE}/build.config.gki.aarch64" \
          LTO=thin \
          CCACHE=ccache \
          ARCH=arm64 \
          build/build.sh -j"$(nproc)"

      # ---------------------------------------------------------
      # ccache statistics
      # ---------------------------------------------------------
      - name: Show final ccache statistics
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Final ccache statistics"
          echo "========================================"

          ccache --show-stats

          echo
          echo "========================================"
          echo "ccache configuration"
          echo "========================================"

          ccache --show-config

      # ---------------------------------------------------------
      # Verify kernel
      # ---------------------------------------------------------
      - name: Verify build output
        shell: bash
        run: |
          set -e

          DIST_DIR="${OUT_DIR:-out}/android12-5.10/dist"

          echo "========================================"
          echo "Checking build output"
          echo "========================================"

          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Distribution directory does not exist:"
            echo "$DIST_DIR"
            exit 1
          fi

          echo
          echo "Distribution directory:"
          ls -lah "$DIST_DIR"

          echo
          echo "Kernel artifacts:"
          find "$DIST_DIR" -type f \
            \( \
              -name "Image" \
              -o -name "Image.lz4" \
              -o -name "vmlinux" \
              -o -name "System.map" \
              -o -name "*.ko" \
            \) \
            -print

          if [ ! -f "$DIST_DIR/Image.lz4" ]; then
            echo "::error::Image.lz4 was not produced."
            exit 1
          fi

          echo
          echo "Build successful."
          echo
          echo "Image.lz4:"
          ls -lh "$DIST_DIR/Image.lz4"

      # ---------------------------------------------------------
      # Prepare artifacts
      # ---------------------------------------------------------
      - name: Prepare artifacts
        if: success()
        shell: bash
        run: |
          set -e

          DIST_DIR="${OUT_DIR:-out}/android12-5.10/dist"

          rm -rf artifacts
          mkdir -p artifacts

          # Main compressed GKI image
          cp "$DIST_DIR/Image.lz4" \
            artifacts/Image.lz4

          # Uncompressed kernel image
          if [ -f "$DIST_DIR/Image" ]; then
            cp "$DIST_DIR/Image" \
              artifacts/Image
          fi

          # vmlinux
          if [ -f "$DIST_DIR/vmlinux" ]; then
            cp "$DIST_DIR/vmlinux" \
              artifacts/vmlinux
          fi

          # System.map
          if [ -f "$DIST_DIR/System.map" ]; then
            cp "$DIST_DIR/System.map" \
              artifacts/System.map
          fi

          # Final configuration
          if [ -f "$DIST_DIR/.config" ]; then
            cp "$DIST_DIR/.config" \
              artifacts/kernel.config
          fi

          # Kernel modules
          find "$DIST_DIR" \
            -type f \
            -name "*.ko" \
            -exec cp {} artifacts/ \;

          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          ls -lah artifacts

      # ---------------------------------------------------------
      # Upload build artifacts
      # ---------------------------------------------------------
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSU-Next-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
