name: Build GKI Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # KernelSU-Next version requested
  KSU_NEXT_REF: v3.4.2

  # Persistent ccache directory
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 10G

  # Kernel architecture
  ARCH: arm64

jobs:
  build:
    name: Build ARM64 GKI Kernel
    runs-on: ubuntu-22.04

    steps:
      # =========================================================
      # Free disk space
      # =========================================================
      - name: Maximize disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      # =========================================================
      # Checkout kernel
      # =========================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: aetherium
          fetch-depth: 1
          submodules: recursive

      # =========================================================
      # Install dependencies
      # =========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            liblz4-tool \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      # =========================================================
      # Configure ccache
      # =========================================================
      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"

          # Compress cached objects to reduce GitHub cache usage
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6

          # Validate compiler by its contents
          ccache --set-config=compiler_check=content

          # Make paths more stable for cache reuse
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "ccache configuration"
          echo "========================================"

          ccache --show-config

      # =========================================================
      # Restore ccache from previous successful runs
      # =========================================================
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            gki-ccache-v3-${{ runner.os }}-
            ${{ hashFiles(
              'Makefile',
              'arch/arm64/configs/gki_defconfig',
              'build.config.gki.aarch64',
              'build.config.common'
            ) }}-
            clang-${{ runner.arch }}
          restore-keys: |
            gki-ccache-v3-${{ runner.os }}-

      # =========================================================
      # Show initial cache
      # =========================================================
      - name: Show initial ccache statistics
        shell: bash
        run: |
          echo "========================================"
          echo "Initial ccache statistics"
          echo "========================================"

          ccache --show-stats

      # =========================================================
      # Display environment
      # =========================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Build environment"
          echo "========================================"

          echo
          echo "Kernel commit:"
          git rev-parse HEAD

          echo
          echo "Kernel branch:"
          git branch --show-current

          echo
          echo "Kernel version:"
          make kernelversion

          echo
          echo "Architecture:"
          echo "$ARCH"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "ccache:"
          ccache --version

      # =========================================================
      # Verify defconfig
      # =========================================================
      - name: Verify GKI defconfig
        shell: bash
        run: |
          set -e

          CONFIG="arch/arm64/configs/gki_defconfig"

          echo "========================================"
          echo "Checking GKI defconfig"
          echo "========================================"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG was not found."
            exit 1
          fi

          echo "Found:"
          ls -lh "$CONFIG"

          echo
          echo "Important configuration:"
          grep -E \
            '^(CONFIG_ARCH_QCOM|CONFIG_KPROBES|CONFIG_MODULES|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_FULL|CONFIG_CFI_CLANG|CONFIG_KASAN)=' \
            "$CONFIG" || true

      # =========================================================
      # Install KernelSU-Next v3.4.2
      # =========================================================
      - name: Install KernelSU-Next
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Installing KernelSU-Next $KSU_NEXT_REF"
          echo "========================================"

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_NEXT_REF}/kernel/setup.sh" \
            | bash -s "$KSU_NEXT_REF"

          echo
          echo "KernelSU-Next setup finished."

          if [ ! -d "KernelSU-Next" ]; then
            echo "::error::KernelSU-Next directory was not created."
            exit 1
          fi

          echo
          echo "KernelSU-Next commit:"
          git -C KernelSU-Next rev-parse HEAD

          echo
          echo "KernelSU-Next description:"
          git -C KernelSU-Next describe --tags --always || true

      # =========================================================
      # Prepare kernel configuration
      # =========================================================
      - name: Configure KernelSU-Next
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparing kernel configuration"
          echo "========================================"

          rm -rf out

          # Generate the configuration from the repository's
          # supplied GKI defconfig.
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          # Enable KernelSU options after KernelSU-Next has
          # inserted its Kconfig entries.
          if [ -x scripts/config ]; then
            CONFIG_TOOL="scripts/config"
          elif [ -f scripts/config ]; then
            chmod +x scripts/config
            CONFIG_TOOL="scripts/config"
          else
            echo "::error::scripts/config was not found."
            exit 1
          fi

          "$CONFIG_TOOL" \
            --file out/.config \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KPROBE_EVENTS \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_KPROBE_HOOKS

          # Recalculate dependencies.
          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

          echo
          echo "KernelSU configuration:"
          grep -E \
            '^CONFIG_(KPROBES|KPROBE_EVENTS|KSU|KSU_KPROBE_HOOKS)=' \
            out/.config || true

          echo
          echo "LTO configuration:"
          grep -E \
            '^CONFIG_LTO_CLANG(_FULL|_THIN)?=' \
            out/.config || true

      # =========================================================
      # Build kernel with ccache
      # =========================================================
      - name: Build kernel
        shell: bash
        env:
          CC: ccache clang
          HOSTCC: ccache clang
          HOSTCXX: ccache clang++
        run: |
          set -e

          echo "========================================"
          echo "Starting GKI kernel build"
          echo "========================================"

          echo
          echo "CPU cores:"
          nproc

          echo
          echo "ccache before build:"
          ccache --show-stats

          # Reset statistics only.
          # This DOES NOT delete the cached objects.
          ccache --zero-stats

          echo
          echo "Building with:"
          echo "  ARCH=arm64"
          echo "  LLVM=1"
          echo "  LLVM_IAS=1"
          echo "  CC=ccache clang"
          echo "  jobs=$(nproc)"

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            -j"$(nproc)"

      # =========================================================
      # Show ccache results
      # =========================================================
      - name: Show final ccache statistics
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "Final ccache statistics"
          echo "========================================"

          ccache --show-stats

          echo
          echo "========================================"
          echo "ccache configuration"
          echo "========================================"

          ccache --show-config

      # =========================================================
      # Locate build output
      # =========================================================
      - name: Locate kernel artifacts
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching for kernel artifacts"
          echo "========================================"

          mkdir -p artifacts

          # Primary ARM64 kernel image
          IMAGE="$(find out -type f -name Image -print -quit || true)"

          if [ -z "$IMAGE" ]; then
            echo "::error::No Image was produced."
            exit 1
          fi

          echo "Image:"
          echo "$IMAGE"

          cp "$IMAGE" artifacts/Image

          # Compressed Image.lz4
          IMAGE_LZ4="$(find out -type f -name Image.lz4 -print -quit || true)"

          if [ -n "$IMAGE_LZ4" ]; then
            echo "Image.lz4:"
            echo "$IMAGE_LZ4"

            cp "$IMAGE_LZ4" artifacts/Image.lz4
          fi

          # vmlinux
          VMLINUX="$(find out -type f -name vmlinux -print -quit || true)"

          if [ -n "$VMLINUX" ]; then
            echo "vmlinux:"
            echo "$VMLINUX"

            cp "$VMLINUX" artifacts/vmlinux
          fi

          # System.map
          SYSTEM_MAP="$(find out -type f -name System.map -print -quit || true)"

          if [ -n "$SYSTEM_MAP" ]; then
            cp "$SYSTEM_MAP" artifacts/System.map
          fi

          # Module.symvers
          MODULE_SYMVERS="$(find out -type f -name Module.symvers -print -quit || true)"

          if [ -n "$MODULE_SYMVERS" ]; then
            cp "$MODULE_SYMVERS" artifacts/Module.symvers
          fi

          # Final kernel configuration
          if [ -f out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi

          # Copy all built kernel modules
          find out \
            -type f \
            -name "*.ko" \
            -exec cp {} artifacts/ \; || true

          echo
          echo "========================================"
          echo "Artifacts"
          echo "========================================"

          ls -lah artifacts

      # =========================================================
      # Upload artifacts
      # =========================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSU-Next-v3.4.2-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14