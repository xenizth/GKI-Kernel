
      - name: Build kernel
        shell: bash
        env:
          CC: ccache clang
          HOSTCC: ccache clang
          HOSTCXX: ccache clang++
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Starting GKI kernel build"
          echo "========================================"

          echo "CPU cores: $(nproc)"
          echo
          echo "Initial memory:"
          free -h
          echo
          echo "Initial disk space:"
          df -h "$GITHUB_WORKSPACE"
          echo
          echo "Initial ccache statistics:"
          ccache --show-stats
          ccache --zero-stats

          # Periodically record resource usage during compilation.
          monitor_resources() {
            while true; do
              sleep 30
              echo
              echo "========== RESOURCE MONITOR =========="
              date -Is
              free -h
              echo "--- Memory and swap (MB) ---"
              awk '
                /MemAvailable:/ {mem=$2}
                /SwapFree:/ {swap=$2}
                END {
                  printf "Available RAM: %.0f MB\n", mem/1024
                  printf "Free swap: %.0f MB\n", swap/1024
                }
              ' /proc/meminfo
              echo "--- Top processes by memory ---"
              ps -eo pid,comm,%cpu,%mem,rss \
                --sort=-rss | head -n 10
              echo "--- Disk space ---"
              df -h "$GITHUB_WORKSPACE"
              echo "======================================"
            done
          }

          monitor_resources &
          MONITOR_PID=$!

          cleanup() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo
          echo "Starting build with 2 parallel jobs."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            -j2

          echo
          echo "Kernel build completed successfully."
          ccache --show-stats
